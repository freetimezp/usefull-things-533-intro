<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./assets/css/style.css" />
        <title>Project</title>
    </head>

    <body>
        <div class="preloader">
            <div class="preloader-header">
                <div class="preloader-header-row">
                    <h1>#exp</h1>
                </div>

                <div class="preloader-header-row">
                    <h1>Studio</h1>
                </div>
            </div>

            <div class="preloader-footer">
                <div class="preloader-counter">
                    <h1>000</h1>
                </div>

                <div class="preloader-footer-copy">
                    <h1>Amazing Team</h1>
                </div>
            </div>
        </div>

        <nav>
            <div class="nav-logo">
                <p>#exp</p>
            </div>

            <div class="nav-toggle">
                <p>Menu</p>
            </div>
        </nav>

        <section class="hero">
            <div class="hero-header">
                <div class="hero-header-row">
                    <h1>Everything</h1>
                </div>

                <div class="hero-header-row">
                    <h1>Beneath</h1>

                    <div class="hero-header-img">
                        <img src="./assets/images/img1.jpg" alt="" />
                        <img src="./assets/images/img2.jpg" alt="" />
                        <img src="./assets/images/img3.jpg" alt="" />
                        <img src="./assets/images/img4.jpg" alt="" />
                        <img src="./assets/images/img5.jpg" alt="" />
                        <img src="./assets/images/img6.jpg" alt="" />
                        <img src="./assets/images/img7.jpg" alt="" />
                        <img src="./assets/images/img8.jpg" alt="" />
                        <img src="./assets/images/img9.jpg" alt="" />
                        <img src="./assets/images/img10.jpg" alt="" />
                    </div>
                </div>

                <div class="hero-header-row">
                    <h1>The Surface</h1>
                </div>
            </div>

            <div class="hero-footer">
                <p>No limit for Ideas..</p>
            </div>
        </section>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/CustomEase.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/SplitText.min.js"></script>

        <script src="./assets/js/main.js"></script>
    </body>
</html>
